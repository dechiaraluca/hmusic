# Identité de hmusic sur le Microsoft Store.
# Les trois valeurs se trouvent dans Partner Center : ton app > Identité du produit (Product identity).
#   identity.name      = « Package/Identity/Name »            (ex. 12345LucaDeChiara.hmusic)
#   publisher          = « Package/Identity/Publisher »       (ex. CN=1A2B3C4D-....)
#   publisher.display  = « Package/Properties/PublisherDisplayName »
# Tant qu'elles valent A-REMPLIR, store.bat fabrique un paquet de test que le Store refusera.
identity.name=LucaDeChiara.hmusicMusiqueselontonhumeur
publisher=CN=09BDA08B-ED4B-4F4B-8941-966DE750CD7B
publisher.display=Luca De Chiara
